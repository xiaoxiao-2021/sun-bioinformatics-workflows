dataset_id: "example"
project_dir: "projects/example_bulk_rnaseq"
input_file: "datasets/raw/expression.xlsx"
sample_metadata: "metadata/samples.tsv"
gene_id_col: "gene_id"
case_group: "case"
control_group: "control"
expression_cutoff: 0.5
min_samples: 3
limma_FDR_cutoff: 0.05
deg_FDR_cutoff: 0.05
deg_logFC_cutoff: 0.5
pvalue_cutoff: 0.05
TREAT_lfc_cutoff: 1
TREAT_FDR_cutoff: 0.05
downstream_deg_method: "limma"
volcano_FDR_cutoff: 0.05
volcano_logFC_cutoff: 1
volcano_label_n: 5
heatmap_top_n: 30
# Heatmap only: all, annotated, or protein_coding
heatmap_gene_filter: "protein_coding"
enrichment_pvalue_cutoff: 0.05
enrichment_FDR_cutoff: 0.05
min_GS_size: 10
max_GS_size: 500
show_category_n: 15
